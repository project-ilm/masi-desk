<main>
<h1>Tokens</h1>
<p>A Zenodo token is sent only to the local server. This page does not write it into the repository, an event, or an index.</p>
<form id="token">
<label>Paste <input name="zenodo" type="password" autocomplete="off"></label>
<label>Or load a file <input name="file" type="file"></label>
<button type="submit">Load into local server</button>
</form>
<pre id="out"></pre>
</main>
<script>
const out = document.getElementById("out");
document.getElementById("token").onsubmit = async (event) => {
  event.preventDefault();
  let value = event.target.zenodo.value;
  const file = event.target.file.files[0];
  if (file) value = (await file.text()).trim();
  const response = await fetch("http://127.0.0.1:8765/api/token", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({zenodo: value})
  });
  out.textContent = JSON.stringify(await response.json(), null, 2);
  event.target.zenodo.value = "";
};
</script>
</body>
</html>
