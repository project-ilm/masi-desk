<!DOCTYPE html>
<html lang="en">
<head>
<!-- © 1993–2026 Abhishek Choudhary. All rights reserved. AyeAI. --><meta charset="utf-8"><title>MASI desk</title><link rel="stylesheet" href="site.css"></head>
<body>
<header><a href="index.html">MASI</a> <a href="docs.html">Docs</a> <a href="desk.html">Desk</a> <a href="tokens.html">Tokens</a> <a href="actions.html">Actions</a></header>
<main>
<h1>Desk</h1>
<p>The face is chosen here. The queue is read from the local server when it is running.</p>
<nav>
<button data-face="author">Author</button>
<button data-face="reviewer">Reviewer</button>
<button data-face="editor">Editor</button>
<button data-face="chair">Chair</button>
<button data-face="irb">IRB</button>
<button data-face="reader">Reader</button>
</nav>
<pre id="out">Not connected.</pre>
<form id="launch">
<label>Kind <select name="kind"><option>journal</option><option>conference</option><option>book</option></select></label>
<label>Title <input name="title" value="Example"></label>
<button type="submit">Launch</button>
</form>
</main>
<script type="module">
import { saltedHash, gateG3 } from "./masi.js";
const out = document.getElementById("out");
const base = "http://127.0.0.1:8765";
document.querySelectorAll("button[data-face]").forEach(button => {
  button.onclick = () => { out.textContent = button.dataset.face; };
});
fetch(base + "/api/health").then(r => r.json()).then(data => {
  out.textContent = JSON.stringify(data, null, 2);
}).catch(() => { out.textContent = "Local server is not running."; });
document.getElementById("launch").onsubmit = async (event) => {
  event.preventDefault();
  const body = {kind: event.target.kind.value, title: event.target.title.value, actor: "editor", owner: "person"};
  const response = await fetch(base + "/api/launch", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  out.textContent = JSON.stringify(await response.json(), null, 2);
};
const hash = await saltedHash("10.5281/example", "not-shown");
const blocked = gateG3({facts: {patent_unfiled: true}}, true);
out.dataset.hash = hash.slice(0, 8);
out.dataset.g3 = blocked;
</script>
</body>
</html>
